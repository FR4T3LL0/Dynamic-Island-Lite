[package]
name = "dynamic-island-lite"
version = "1.0.0-alpha.4"
edition = "2021"
rust-version = "1.96"
default-run = "dynamic-island-lite"

[workspace]
members = ["crates/island-core", "crates/island-win"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-e2e = []

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
island-core = { path = "crates/island-core" }
island-win = { path = "crates/island-win" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_Graphics_Dwm"] }
webview2-com = "=0.39.1"
